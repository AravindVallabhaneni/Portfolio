<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#001E2B" />
      <stop offset="50%" stop-color="#022735" />
      <stop offset="100%" stop-color="#00141E" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00ED64" />
      <stop offset="50%" stop-color="#00C753" />
      <stop offset="100%" stop-color="#00684A" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="800" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00ED64" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#00684A" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00ED64" stop-opacity="0.5" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00ED64" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="16" fill="url(#bgGrad)" />
  <rect width="800" height="520" fill="url(#gridPattern)" />

  <!-- Outer Border -->
  <rect x="16" y="16" width="768" height="488" rx="12" fill="none" stroke="url(#borderGrad)" stroke-width="2" />
  <rect x="24" y="24" width="752" height="472" rx="8" fill="none" stroke="#00ED64" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Top Accent Bar -->
  <rect x="24" y="24" width="752" height="6" fill="url(#accentGrad)" />

  <!-- Issuer Header -->
  <g transform="translate(60, 65)">
