    <path d="M12 20L17 25L28 14" stroke="#00ED64" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="50" y="18" fill="#00ED64" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="2">FACE PREP • CERTIFICATE OF COMPLETION</text>
    <text x="50" y="32" fill="#8B949E" font-family="-apple-system, sans-serif" font-size="11" letter-spacing="1">INDUSTRY-ALIGNED DATABASE CURRICULUM</text>
  </g>

  <!-- Main Certificate Title -->
  <text x="400" y="150" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" letter-spacing="3" text-anchor="middle">THIS IS PROUDLY CONFERRED UPON</text>
  <text x="400" y="195" fill="#FFFFFF" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Vallabhaneni Naga Aravind Babu</text>
  
  <text x="400" y="235" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12" letter-spacing="1.5" text-anchor="middle">FOR DEMONSTRATING PROFICIENCY AS A</text>
  
  <text x="400" y="275" fill="#00ED64" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="24" font-weight="700" letter-spacing="1" text-anchor="middle">MongoDB Associate Database Administrator</text>

  <!-- Divider Line -->
  <line x1="160" y1="298" x2="640" y2="298" stroke="#00ED64" stroke-opacity="0.25" stroke-width="1" />

  <!-- Competencies List -->
  <g transform="translate(140, 325)">
    <!-- Item 1 -->
    <rect x="0" y="0" width="160" height="42" rx="6" fill="#021C26" stroke="#00ED64" stroke-opacity="0.2" stroke-width="1" />
    <text x="80" y="18" fill="#00ED64" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Schema Design</text>
    <text x="80" y="32" fill="#8B949E" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Document Modelling</text>

    <!-- Item 2 -->
    <rect x="180" y="0" width="160" height="42" rx="6" fill="#021C26" stroke="#00ED64" stroke-opacity="0.2" stroke-width="1" />
    <text x="260" y="18" fill="#00ED64" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Indexing &amp; Perf</text>
    <text x="260" y="32" fill="#8B949E" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Execution Plans</text>

    <!-- Item 3 -->
    <rect x="360" y="0" width="160" height="42" rx="6" fill="#021C26" stroke="#00ED64" stroke-opacity="0.2" stroke-width="1" />
    <text x="440" y="18" fill="#00ED64" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Aggregation Engine</text>
    <text x="440" y="32" fill="#8B949E" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Multi-Stage Pipelines</text>
  </g>

  <!-- Bottom Verification Footer -->
  <g transform="translate(60, 420)">
    <!-- Issuer Seal -->
    <circle cx="35" cy="35" r="30" fill="#021C26" stroke="#00ED64" stroke-width="2" />
    <circle cx="35" cy="35" r="24" fill="none" stroke="#00ED64" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2 2" />
    <path d="M25 35L32 42L45 27" stroke="#00ED64" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="80" y="28" fill="#FFFFFF" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" font-weight="700">ISSUED CREDENTIAL</text>
    <text x="80" y="44" fill="#00ED64" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="11" font-weight="600">FACE Prep Technical Academy</text>
    <text x="80" y="58" fill="#8B949E" font-family="monospace" font-size="10">Status: Verified Completion Document</text>
  </g>

  <g transform="translate(560, 435)">
    <text x="180" y="16" fill="#8B949E" font-family="monospace" font-size="10" text-anchor="end">ISSUER: FACE PREP</text>
    <text x="180" y="32" fill="#8B949E" font-family="monospace" font-size="10" text-anchor="end">DISCIPLINE: DATABASE ADMINISTRATION</text>
    <text x="180" y="48" fill="#00ED64" font-family="monospace" font-size="10" text-anchor="end">STATUS: DOCUMENT ISSUED</text>
  </g>
</svg>
