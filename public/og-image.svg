<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0A0E14" />
  <!-- Radial Glow -->
  <circle cx="200" cy="150" r="400" fill="#0284C7" fill-opacity="0.15" />
  <circle cx="1050" cy="480" r="350" fill="#F59E0B" fill-opacity="0.08" />
  
  <!-- Subtle Grid -->
  <g stroke="#30363D" stroke-width="1" stroke-opacity="0.3">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" />
    <path d="M100 0 V630 M200 0 V630 M300 0 V630 M400 0 V630 M500 0 V630 M600 0 V630 M700 0 V630 M800 0 V630 M900 0 V630 M1000 0 V630 M1100 0 V630" />
  </g>

  <!-- Content Box -->
  <g transform="translate(100, 140)">
    <!-- Status Tag -->
    <rect width="280" height="40" rx="20" fill="#161B22" stroke="#0284C7" stroke-width="1.5" />
    <circle cx="24" cy="20" r="5" fill="#10B981" />
    <text x="42" y="25" fill="#38BDF8" font-family="monospace" font-size="16" font-weight="600">FULL-STACK DEVELOPER</text>

    <!-- Main Name -->
    <text x="0" y="120" fill="#F0F6FC" font-family="'Space Grotesk', sans-serif" font-size="64" font-weight="700">Aravind Vallabhaneni</text>
    
    <!-- Tagline -->
    <text x="0" y="180" fill="#8B949E" font-family="'Inter', sans-serif" font-size="26" font-weight="400">
      Fresher full-stack developer building production-grade web apps,
    </text>
    <text x="0" y="218" fill="#8B949E" font-family="'Inter', sans-serif" font-size="26" font-weight="400">
      from geospatial maps to AI-powered tools.
    </text>

    <!-- Badges / Stack -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="130" height="42" rx="8" fill="#161B22" stroke="#30363D" />
      <text x="22" y="26" fill="#C9D1D9" font-family="monospace" font-size="16">React 18</text>

      <rect x="145" y="0" width="120" height="42" rx="8" fill="#161B22" stroke="#30363D" />
      <text x="165" y="26" fill="#C9D1D9" font-family="monospace" font-size="16">Node.js</text>

      <rect x="280" y="0" width="140" height="42" rx="8" fill="#161B22" stroke="#30363D" />
      <text x="300" y="26" fill="#C9D1D9" font-family="monospace" font-size="16">PostGIS</text>

      <rect x="435" y="0" width="150" height="42" rx="8" fill="#161B22" stroke="#30363D" />
      <text x="455" y="26" fill="#C9D1D9" font-family="monospace" font-size="16">Supabase</text>

      <rect x="600" y="0" width="160" height="42" rx="8" fill="#161B22" stroke="#30363D" />
      <text x="620" y="26" fill="#C9D1D9" font-family="monospace" font-size="16">AI Integration</text>
    </g>
  </g>

  <!-- URL watermark -->
  <text x="100" y="560" fill="#38BDF8" font-family="monospace" font-size="20" font-weight="600">aravindvallabhaneni.dev</text>
</svg>

